# ============================================================================
# .pre-commit-config.yaml — 提交前质量门禁（可选启用）
# 使用方式：pip install pre-commit && pre-commit install
# 参考：pre-commit 官方基础 hooks（https://github.com/pre-commit/pre-commit-hooks）
# 注意：
#   - 保持 hook 版本与 pyproject.toml 中 dev 依赖版本一致（避免规则漂移）
#   - 若预提交全量检查太慢，可针对单个文件：git add <file> && pre-commit run --files <file>
# ============================================================================
repos:
  # --- 基础通用 hooks（pre-commit-hooks 官方仓库）---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace        # 行尾空白
      - id: end-of-file-fixer          # 文件末尾统一换行
      - id: check-yaml                 # YAML 语法（.github/ 与 workflow 配置）
      - id: check-merge-conflict       # 冲突标记残留
      - id: detect-private-key         # 误提交私钥检测
      - id: mixed-line-ending          # 换行符统一（与 .gitattributes 配套）

  # --- 语言 lint（与 pyproject.toml dev 依赖版本一致）---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
      - id: ruff-format

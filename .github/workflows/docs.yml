# ============================================================================
# docs.yml — 文档站点构建与发布（mkdocs-material → GitHub Pages）
#
# 触发：docs/** 或 mkdocs.yml 变更；main 合并后发布，PR 仅构建校验
# 前置：仓库 Settings → Pages → Source 选择 "GitHub Actions"
# 口径：mkdocs build --strict（警告即失败，与本地命令一致）
# 契约：docs/ 内跨目录链接（skills/ scripts/ AGENTS.md 等）由 verify-docs.py
#       以全仓视角校验（CI quality-gate），mkdocs 侧 not_found 有意忽略
# ============================================================================
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# 最小权限：构建只读；写权限仅在 deploy job 补
permissions:
  contents: read

# Pages 部署不取消进行中的部署（GitHub 官方 starter 惯例）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 安装文档依赖
        # 按需钉版（material 大版本升级可能改变构建告警口径，与本仓 ruff 钉版同理）
        run: python -m pip install mkdocs-material
      - name: 构建（严格模式：警告即失败）
        run: python -m mkdocs build --strict
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # PR 仅构建校验；发布限 main push 或手动触发
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

# ============================================================================
# docs.yml — 文档站点构建与发布（mkdocs-material → GitHub Pages）
#
# 触发：docs/** 或 mkdocs.yml 变更；main 合并后发布，PR 仅构建校验
# 前置（仅"发布"需要）：仓库 Settings → Pages → Source 选择 "GitHub Actions"，
#   并设置仓库变量 ENABLE_PAGES=true 以启用发布 job；
#   未设置时本工作流只跑"严格构建"门禁（configure-pages 会调 Pages API，
#   仓库未启用 Pages 时返回 404 会让文档门禁整体变红——门禁不该被部署前置条件绑架，2026-10-11 实测修复）
# 口径：mkdocs build --strict（警告即失败，与本地命令一致）
# 契约：docs/ 内跨目录链接（skills/ scripts/ AGENTS.md 等）由 verify-docs.py
#       以全仓视角校验（CI quality-gate），mkdocs 侧 not_found 有意忽略
# ============================================================================
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# 最小权限：构建只读；写权限仅在 deploy job 补
permissions:
  contents: read

# Pages 部署不取消进行中的部署（GitHub 官方 starter 惯例）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 安装文档依赖
        # 按需钉版（material 大版本升级可能改变构建告警口径，与本仓 ruff 钉版同理）
        run: python -m pip install mkdocs-material
      - name: 构建（严格模式：警告即失败）
        run: python -m mkdocs build --strict
      # configure-pages 不在此 job：它要求仓库已启用 Pages，否则 API 404 → 无部署需求的仓库
      # 文档门禁恒红（2026-10-11 实测）。它随发布 job 走。
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # PR 仅构建校验；发布限 main push/手动触发，且需显式开启 Pages（仓库变量 ENABLE_PAGES=true）
    # 未开启时本 job 跳过——严格构建门禁（build job）照常守护文档质量
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

# ============================================================================
# release-drafter workflow — 自动生成 Release 草稿
# 触发：main 分支推送 / PR 合并时更新草稿
# 前置：.github/release-drafter.yml 分类配置
# 注意：首次需仓库 Settings → Actions → Workflow permissions 允许写权限
# 分工：本文件仅生成「按 PR 标签汇总」的草稿供预览；正式发布由 release.yml 执行
#       （正文取 CHANGELOG 对应段落）。若项目以 PR 汇总为发布正文，可保留草稿直接
#       发版并停用 release.yml；反之可删除本文件（二选一，决策记录见 rules/adr/）。
# ============================================================================
name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ============================================================================
# release-drafter workflow — 自动生成 Release 草稿
# 触发：main 分支推送 / PR 合并时更新草稿
# 前置：.github/release-drafter.yml 分类配置
# 注意：首次需仓库 Settings → Actions → Workflow permissions 允许写权限
# ============================================================================
name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

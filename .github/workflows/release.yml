# ============================================================================
# release.yml — Tag 自动发布
# 触发：推送 v* tag（如 v1.2.3）
# 流程：构建 → 测试 → 生成 Release（内容取自 CHANGELOG 对应版本段落）
# 前置：
#   1. release-drafter.yml 生成草稿（PR 合并后自动更新）
#   2. 发布者创建 tag：git tag v1.2.3 && git push origin v1.2.3
#   3. 首次需仓库 Settings → Actions → Workflow permissions 允许写权限
# 说明：模板仓库自身无构建系统，初始化后按语言补 setup 步骤（见 ci.yml 注释）。
# ============================================================================
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # --- 按语言选择 setup（二选一，初始化时启用）---
      # Python:
      # - uses: actions/setup-python@v5
      #   with: { python-version: "3.12" }
      # - run: pip install -e ".[dev]"
      # .NET:
      # - uses: actions/setup-dotnet@v4
      #   with: { dotnet-version: "9.0.x" }

      - name: Build
        run: {{BUILD_CMD}}

      - name: Test
        run: {{TEST_CMD}}

      - name: 生成 Release（正文取 CHANGELOG 对应段落）
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          BODY="$(awk -v tag="$TAG" '
            BEGIN { found = 0; printed = 0 }
            /^## \[/ {
              if (found) { exit }
              ver = $0
              sub(/^## \[/, "", ver)
              sub(/\].*/, "", ver)
              if (ver == tag || "v" ver == tag) { found = 1; next }
            }
            found && !printed { print; if (/^## /) printed = 1 }
          ' CHANGELOG.md)"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "${BODY:-*此版本无 CHANGELOG 条目，请人工补充。*}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true

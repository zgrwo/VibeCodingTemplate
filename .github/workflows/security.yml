# ============================================================================
# security.yml — CodeQL 安全扫描
# 触发：main 推送 / PR / 每周一凌晨 2 点定时
# 前置：仓库 Settings → Code security → CodeQL 默认设置关闭（避免重复），
#       或保持默认设置启用并删除本文件（二选一）
# ============================================================================
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 按项目语言调整：python / javascript-typescript / go / java ...
        # 注：VBA 无 CodeQL 语言（省略）；模板文件 *.template 不被 CodeQL 分析
        # csharp/go 为编译型语言，需可构建源码；本仓 C#/Go 仅存在于 *.template
        # （CodeQL 不分析且无法构建）与 examples（无 .sln/.csproj/go.mod）→
        # autobuild 必然硬失败。仅保留 extraction 型语言（python/javascript-typescript）。
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 依赖漏洞扫描（pip-audit）
        # 检查项目已解析依赖是否含已知 CVE（补 CodeQL 静态分析盲区；来源：工程分析套件）。
        # 关键：必须先安装项目依赖再 audit（否则审计的是 runner 环境而非项目依赖 = no-op），
        # 失败硬失败（exit 1）而非吞掉——否则"已扫描"是假象。
        if: matrix.language == 'python'
        run: |
          python -m pip install pip-audit
          python -m pip install -e ".[dev]" 2>/dev/null || python -m pip install -r requirements.txt 2>/dev/null || true
          python -m pip_audit || { echo "::error::pip-audit 发现已知 CVE 依赖，请升级"; exit 1; }
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          # 按需配置查询集：
          # queries: security-and-quality
      - uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

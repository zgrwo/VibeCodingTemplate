# ============================================================================
# detect-template.yml — 可复用工作流：检测仓库是否为模板仓库自身
#
# 用法（调用方 workflow）：
#   jobs:
#     detect:
#       uses: ./.github/workflows/detect-template.yml
#     build:
#       needs: detect
#       if: needs.detect.outputs.is_template != 'true'
#       run: ...
# ============================================================================
name: Detect Template

on:
  workflow_call:
    outputs:
      is_template:
        description: "true if AGENTS.md still has the unreplaced core placeholder {{PROJECT_NAME}}"
        value: ${{ jobs.check.outputs.is_template }}

# 最小权限：仅读取仓库内容（checkout 需要）
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      is_template: ${{ steps.detect.outputs.is_template }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Detect template mode
        id: detect
        run: |
          # 防 init 替换（同 ci.yml，P0）：检测模式运行时拼装，文件内不出现可被 init 匹配的字面量；
          # grep -F 固定串匹配：避免 BRE 转义 \{ 依赖 grep 版本宽容行为（新版 GNU grep 报
          # "Invalid content of \{\}" exit 2，见 rules/tooling-pitfalls.md #25）。
          open='{{'
          close='}}'
          if grep -Fq "${open}PROJECT_NAME${close}" AGENTS.md; then
            echo "is_template=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          fi

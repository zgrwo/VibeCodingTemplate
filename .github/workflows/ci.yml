# CI — 分层质量门禁（quick / full / quality / template-self-test）
#
# 用法：
#   - PR 自动触发（按路径过滤，节省资源）
#   - workflow_dispatch 手动触发全量
#   - quality 门禁：手册数值一致性 / 陷阱审计 / 文档一致性 / 代码风格（硬门禁，失败即红）
# 初始化时按项目语言替换命令占位符 {{*}}。
# 模板仓库自举：占位符未替换时（即模板仓库自身），含 {{*}} 命令的步骤被 detect 步骤跳过。

name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "rules/**"
      - "skills/**"
      - "docs/**"
      - "examples/**"
      - ".github/**"
      - "AGENTS.md"
      - "README.md"
      - "README.en.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - ".release-please-manifest.json"  # 版本基线变更必须过 CI（2026-08 Max 审查补充）
      - "pyproject.toml"
      - "Makefile"
      - ".pre-commit-config.yaml"
  workflow_dispatch:
  # Merge Queue：配合 Settings → Branches → 开启 merge queue 使用
  # （merge_group 事件无 paths 过滤，全部 job 运行；未开启 merge queue 时本触发不生效）
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：本工作流只读仓库内容（Security hardening 最佳实践）
# pull-requests: read 供 dependency-review-action 读取 PR 元数据（2026-08 Max 审查补充）
permissions:
  contents: read
  pull-requests: read

jobs:
  # ============ quick：PR 级快速验证 ============
  quick-check:
    name: Quick Check (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # --- 多版本矩阵（可选，初始化时按需启用）---
    # 何时启用：需保证跨版本兼容的库项目（如库需支持 Python 3.10-3.12 / .NET 8+9）。
    # 启用方法：取消注释下方 strategy 块 + 对应语言的 setup 步骤（见下方 setup 注释），
    #          quick-check 与 full-check 需同步启用矩阵。
    # strategy:
    #   matrix:
    #     python-version: ["3.10", "3.11", "3.12"]   # Python 项目
    #     dotnet-version: ["8.0.x", "9.0.x"]          # .NET 项目
    steps:
      # fetch-depth: 0 —— 提交规范检查需要 PR 基线与完整提交历史
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      # --- 模板仓库检测：占位符未替换（=模板仓库自身）时跳过构建 ---
      - name: 检测是否为模板仓库自身
        id: detect
        run: |
          # 防 init 替换（P0）：检测模式若以字面双花括号占位符形式出现在本文件，会被 init 替换成项目名
          # （生成项目 AGENTS.md 必然含项目名 → is_template 恒 true，下游 CI 门禁永久跳过）；
          # 故模式运行时拼装（open/close 分离），文件内不出现可被 init 匹配的字面量。
          # grep -F 固定串匹配：避免 BRE 转义 \{ 依赖 grep 版本宽容行为——新版 GNU grep（3.11）报
          # "Invalid content of \{\}"（exit 2）且被 2>/dev/null 掩盖 → is_template 恒 false、模板模式
          # 跳过逻辑失效（2026-08-15 runner 镜像 20260810.271.1 实证，见 rules/tooling-pitfalls.md #25）。
          open='{{'
          close='}}'
          if grep -Fq "${open}PROJECT_NAME${close}" AGENTS.md; then
            echo "is_template=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          fi
      # --- 提交规范：PR 内全部 commit 必须符合 Conventional Commits（与 release-please 闭环）---
      - name: 提交规范检查（Conventional Commits）
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          count=0
          for sha in $(git rev-list --no-merges "$base..HEAD"); do
            count=$((count + 1))
            if ! git show -s --format=%B "$sha" | bash scripts/validate-commit-msg.sh >/dev/null 2>&1; then
              echo "❌ 提交 ${sha:0:7} 不符合 Conventional Commits 规范："
              git show -s --format='   %s' "$sha"
              echo "   规则见 scripts/validate-commit-msg.sh 与 CONTRIBUTING「提交规范」"
              exit 1
            fi
          done
          echo "✅ 全部 $count 个提交符合规范"
      # --- 按语言选择 setup（二选一，固定 commit SHA）---
      # Python:
      # - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      #   with: { python-version: ${{ matrix.python-version }} }
      # - run: pip install -e ".[dev]"
      # .NET:
      # - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      #   with: { dotnet-version: ${{ matrix.dotnet-version }} }
      - name: Build
        if: steps.detect.outputs.is_template != 'true'
        run: "{{BUILD_CMD}}"
      - name: Test
        if: steps.detect.outputs.is_template != 'true'
        run: "{{TEST_CMD}}"
      - name: 提交前自检（无裸 catch / bare except）
        # 与 verify-docs 语义检查向量 1 同源（注释/docstring 感知）：裸 grep 会命中
        # scripts/verify-docs.py docstring 内的 `except:` 教学文字（2026-08-15 实证，
        # rules/tooling-pitfalls.md #20），故统一由单一信源执行。
        run: python3 scripts/verify-docs.py --check-bare-handlers

  # ============ full：手动全量验证 ============
  full-check:
    name: Full Verify (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # --- 模板仓库检测：占位符未替换（=模板仓库自身）时跳过 ---
      - name: 检测是否为模板仓库自身
        id: detect
        run: |
          # 防 init 替换（P0）：检测模式若以字面双花括号占位符形式出现在本文件，会被 init 替换成项目名
          # （生成项目 AGENTS.md 必然含项目名 → is_template 恒 true，下游 CI 门禁永久跳过）；
          # 故模式运行时拼装（open/close 分离），文件内不出现可被 init 匹配的字面量。
          # grep -F 固定串匹配：避免 BRE 转义 \{ 依赖 grep 版本宽容行为——新版 GNU grep（3.11）报
          # "Invalid content of \{\}"（exit 2）且被 2>/dev/null 掩盖 → is_template 恒 false、模板模式
          # 跳过逻辑失效（2026-08-15 runner 镜像 20260810.271.1 实证，见 rules/tooling-pitfalls.md #25）。
          open='{{'
          close='}}'
          if grep -Fq "${open}PROJECT_NAME${close}" AGENTS.md; then
            echo "is_template=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          fi
      # --- setup 同上 ---
      - name: Full verify
        if: steps.detect.outputs.is_template != 'true'
        run: "{{FULL_VERIFY_CMD}}"

  # ============ quality：质量门禁（硬门禁，不设 continue-on-error）============
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quick-check
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # --- 模板仓库检测：占位符未替换时跳过 LINT/COVERAGE（命令占位符在模板仓库不可执行）---
      - name: 检测是否为模板仓库自身
        id: detect
        run: |
          # 防 init 替换（P0）：检测模式若以字面双花括号占位符形式出现在本文件，会被 init 替换成项目名
          # （生成项目 AGENTS.md 必然含项目名 → is_template 恒 true，下游 CI 门禁永久跳过）；
          # 故模式运行时拼装（open/close 分离），文件内不出现可被 init 匹配的字面量。
          # grep -F 固定串匹配：避免 BRE 转义 \{ 依赖 grep 版本宽容行为——新版 GNU grep（3.11）报
          # "Invalid content of \{\}"（exit 2）且被 2>/dev/null 掩盖 → is_template 恒 false、模板模式
          # 跳过逻辑失效（2026-08-15 runner 镜像 20260810.271.1 实证，见 rules/tooling-pitfalls.md #25）。
          open='{{'
          close='}}'
          if grep -Fq "${open}PROJECT_NAME${close}" AGENTS.md; then
            echo "is_template=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 依赖变更审查（PR）
        # 需依赖清单文件（pyproject.toml / *.csproj / package-lock.json 等）；无清单的项目删除此步骤
        if: steps.detect.outputs.is_template != 'true' && github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
      - name: 安装示例 CrossVal 依赖（模板模式）
        # 必须在「手册数值一致性」（verify-manual.py）之前：verify-manual 会执行
        # examples/scripts/crossval/StatsCrossVal.py（顶层 import numpy），numpy 缺失时
        # run_crossval 计入 _FAIL → quality-gate 恒红（2026-08 Max 审查 F2 修复）。
        # 同时安装 pytest/ruff：模板模式的 pytest/ruff 字面命令步骤需要（模板模式
        # 跳过 .[dev] 安装步骤，2026-08 Max 审查 F3 补漏）。
        if: steps.detect.outputs.is_template == 'true'
        run: python -m pip install numpy pytest ruff
      - name: 模板模式全量测试（pytest 字面命令）
        # 模板仓库自身门禁：quick-check 的 Test 步骤（{{TEST_CMD}} 占位符）在模板模式被跳过，
        # 模板自身的全部 pytest 测试必须由本步骤硬门禁守护（2026-08 Max 审查 F3 修复）。
        if: steps.detect.outputs.is_template == 'true'
        run: python -m pytest tests/ -q
      - name: 模板模式代码风格（ruff 字面命令）
        # 模板仓库自身门禁：quality-gate 的 LINT 步骤（{{LINT_CMD}}）在模板模式被跳过，
        # scripts/tests/examples 的 lint 由本步骤硬门禁守护（2026-08 Max 审查 F3 修复）。
        if: steps.detect.outputs.is_template == 'true'
        run: python -m ruff check scripts/ tests/ examples/
      - name: 手册数值一致性
        run: python scripts/verify-manual.py
      - name: 陷阱审计（falsy / 结构）
        run: python scripts/falsy-audit.py
      - name: 文档与结构一致性（断链/目录树/未声明文件）
        run: python scripts/verify-docs.py --strict
      - name: 注册表一致性（多注册表键集比对）
        run: python scripts/verify-registries.py
      - name: 文档计数一致性（AUTO_COUNTS 标记比对）
        run: python scripts/gen-doc-counts.py --check
      - name: 测试质量守卫（弱断言/缺测/无意义命名）
        run: |
          python scripts/test-quality-guard.py
          # scripts/ 缺测检测（模板自身治理脚本守卫；默认 --src src 对模板为空转，
          # 2026-08 Max 审查 #D8 修复，与 verify-all 保持一致）
          python scripts/test-quality-guard.py --src scripts --tests tests/scripts
      - name: 安装门禁依赖（LINT/COVERAGE 所需）
        # Python：pip install -e ".[dev]"（含 ruff、pytest、pytest-cov）
        # C#：   actions/setup-dotnet + dotnet restore（按实际工具链替换）
        # 缺依赖时 LINT/COVERAGE 会因"工具未安装"而红，报错与代码质量无关，
        # 开发者无法区分环境问题与质量问题，故须在此显式安装（显式 step 而非塞进占位符，便于排障）。
        if: steps.detect.outputs.is_template != 'true'
        run: python -m pip install -e ".[dev]"
      - name: 代码风格
        # Python: ruff check src/ scripts/
        # C#:    dotnet format --verify-no-changes
        if: steps.detect.outputs.is_template != 'true'
        run: "{{LINT_CMD}}"
      - name: 覆盖率门禁
        # Python: pytest --cov=src --cov-fail-under=80（需 dev 依赖 pytest-cov）
        # C#:    dotnet test --collect:"XPlat Code Coverage"（需 coverlet.collector）
        # 覆盖率数据缺失时须显式失败而非静默通过（防门禁说谎；来源：成本分析套件）。
        # set -o pipefail 防管道尾命令吞掉 pytest 失败（如 `pytest ... | tee`）。
        if: steps.detect.outputs.is_template != 'true'
        shell: bash
        run: |
          set -o pipefail
          {{COVERAGE_CMD}}

  # ============ template-self-test：模板仓库自测 ============
  # 仅模板仓库运行（AGENTS.md 中残留未替换的核心占位符即视为模板）。
  # 新项目初始化替换占位符后由 detect 门控直接跳过整个 job（不启动 runner，省 2 runner-minutes），无需删除。
  detect:
    name: Detect Template Mode
    uses: ./.github/workflows/detect-template.yml
  template-self-test:
    name: Template Self-Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: detect
    if: needs.detect.outputs.is_template == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 安装验证依赖（verify-manual 执行示例 CrossVal 需 numpy；示例多语言测试需 pytest）
        run: python -m pip install numpy pytest
      - name: 检测是否为模板仓库自身（存在未替换占位符）
        id: detect
        shell: bash
        run: |
          # 防 init 替换（P0）：检测模式若以字面双花括号占位符形式出现在本文件，会被 init 替换成项目名
          # （生成项目 AGENTS.md 必然含项目名 → is_template 恒 true，下游 CI 门禁永久跳过）；
          # 故模式运行时拼装（open/close 分离），文件内不出现可被 init 匹配的字面量。
          # grep -F 固定串匹配：避免 BRE 转义 \{ 依赖 grep 版本宽容行为——新版 GNU grep（3.11）报
          # "Invalid content of \{\}"（exit 2）且被 2>/dev/null 掩盖 → is_template 恒 false、模板模式
          # 跳过逻辑失效（2026-08-15 runner 镜像 20260810.271.1 实证，见 rules/tooling-pitfalls.md #25）。
          open='{{'
          close='}}'
          if grep -Fq "${open}PROJECT_NAME${close}" AGENTS.md; then
            echo "is_template=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 模板守卫（NewModule 模板禁止引入双花括号占位符）
        if: steps.detect.outputs.is_template == 'true'
        shell: bash
        run: |
          # 按占位符粒度过滤：先提取全部 {{...}}，再剔除恰为 {{ROOT_NAMESPACE}} 的合法 token，
          # 避免行级 grep -v 把"同行含合法与泄漏占位符"的整行剔除而隐藏泄漏（P3-9）
          leaked=$(grep -rn -o "{{[A-Za-z_]*}}" templates/NewModule/ | grep -v '{{ROOT_NAMESPACE}}' || true)
          if [ -n "$leaked" ]; then
            echo "❌ 模板引入双花括号占位符（会被 init 扫描替换，应改用单花括号 {Name}）："
            echo "$leaked"
            exit 1
          fi
          echo "✅ NewModule 模板无双花括号占位符泄漏"
      - name: 模板自测（init → verify-docs/manual/falsy）
        if: steps.detect.outputs.is_template == 'true'
        run: pwsh -File scripts/test-template.ps1
      - name: 示例多语言测试（TS/Go/Rust/Python）
        # examples/ 四语言示例测试接入 CI（2026-08 Max 审查豁免到期处理）：
        #   - TS:  examples/package.json（vitest，17 tests）
        #   - Go:  examples/go.mod + go test ./tests/...（16 用例）
        #   - Rust: examples/Cargo.toml + cargo test（2 个 #[test] 函数 15 用例）
        #   - Python: pytest examples/tests/（16 tests，conftest.py 引导 src.stats）
        # GitHub 托管 runner（ubuntu/windows）均预装 Node/Go/Rust 工具链；
        # 仅模板模式运行（下游项目不强制多语言工具链）。
        # 注意：只 cd 一次——bash run 块内 cd 跨行持久，重复 cd 会进入不存在的
        # examples/examples 并短路后续命令（2026-08 Max 审查 P1 修复）。
        if: steps.detect.outputs.is_template == 'true'
        shell: bash
        run: |
          set -o pipefail
          python -m pytest examples/tests/ -q
          cd examples
          npm ci --no-audit --no-fund
          npx vitest run
          go test ./tests/... -v
          cargo test

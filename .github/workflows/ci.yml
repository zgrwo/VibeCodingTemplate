# CI — 分层质量门禁（quick / full / quality / template-self-test）
#
# 用法：
#   - PR 自动触发（按路径过滤，节省资源）
#   - workflow_dispatch 手动触发全量
#   - quality 门禁：手册数值一致性 / 陷阱审计 / 文档一致性 / 代码风格（硬门禁，失败即红）
# 初始化时按项目语言替换命令占位符 {{*}}。
# 模板仓库自举：占位符未替换时（即模板仓库自身），含 {{*}} 命令的步骤被 detect 步骤跳过。

name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "rules/**"
      - "skills/**"
      - "docs/**"
      - "examples/**"
      - ".github/**"
      - "AGENTS.md"
      - "README.md"
      - "README.en.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
  workflow_dispatch:
  # Merge Queue：配合 Settings → Branches → 开启 merge queue 使用
  # （merge_group 事件无 paths 过滤，全部 job 运行；未开启 merge queue 时本触发不生效）
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：本工作流只读仓库内容（Security hardening 最佳实践）
permissions:
  contents: read

jobs:
  # ============ quick：PR 级快速验证 ============
  quick-check:
    name: Quick Check (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # --- 多版本矩阵（可选，初始化时按需启用）---
    # 何时启用：需保证跨版本兼容的库项目（如库需支持 Python 3.10-3.12 / .NET 8+9）。
    # 启用方法：取消注释下方 strategy 块 + 对应语言的 setup 步骤（见下方 setup 注释），
    #          quick-check 与 full-check 需同步启用矩阵。
    # strategy:
    #   matrix:
    #     python-version: ["3.10", "3.11", "3.12"]   # Python 项目
    #     dotnet-version: ["8.0.x", "9.0.x"]          # .NET 项目
    steps:
      # fetch-depth: 0 —— 提交规范检查需要 PR 基线与完整提交历史
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      # --- 模板仓库检测：占位符未替换（=模板仓库自身）时跳过构建 ---
      - name: 检测是否为模板仓库自身
        id: detect
        run: |
          if grep -rq '{{' AGENTS.md 2>/dev/null; then
            echo "is_template=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          fi
      # --- 提交规范：PR 内全部 commit 必须符合 Conventional Commits（与 release-please 闭环）---
      - name: 提交规范检查（Conventional Commits）
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          count=0
          for sha in $(git rev-list --no-merges "$base..HEAD"); do
            count=$((count + 1))
            if ! git show -s --format=%B "$sha" | bash scripts/validate-commit-msg.sh >/dev/null 2>&1; then
              echo "❌ 提交 ${sha:0:7} 不符合 Conventional Commits 规范："
              git show -s --format='   %s' "$sha"
              echo "   规则见 scripts/validate-commit-msg.sh 与 CONTRIBUTING「提交规范」"
              exit 1
            fi
          done
          echo "✅ 全部 $count 个提交符合规范"
      # --- 按语言选择 setup（二选一，固定 commit SHA）---
      # Python:
      # - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      #   with: { python-version: ${{ matrix.python-version }} }
      # - run: pip install -e ".[dev]"
      # .NET:
      # - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      #   with: { dotnet-version: ${{ matrix.dotnet-version }} }
      - name: Build
        if: steps.detect.outputs.is_template != 'true'
        run: "{{BUILD_CMD}}"
      - name: Test
        if: steps.detect.outputs.is_template != 'true'
        run: "{{TEST_CMD}}"
      - name: 提交前自检（无裸 catch / bare except）
        run: |
          grep -rn "catch\s*{" src/ --include="*.cs" && exit 1 || true
          grep -rn "except:" src/ && exit 1 || true

  # ============ full：手动全量验证 ============
  full-check:
    name: Full Verify (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # --- 模板仓库检测：占位符未替换（=模板仓库自身）时跳过 ---
      - name: 检测是否为模板仓库自身
        id: detect
        run: |
          if grep -rq '{{' AGENTS.md 2>/dev/null; then
            echo "is_template=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          fi
      # --- setup 同上 ---
      - name: Full verify
        if: steps.detect.outputs.is_template != 'true'
        run: "{{FULL_VERIFY_CMD}}"

  # ============ quality：质量门禁（硬门禁，不设 continue-on-error）============
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quick-check
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # --- 模板仓库检测：占位符未替换时跳过 LINT/COVERAGE（命令占位符在模板仓库不可执行）---
      - name: 检测是否为模板仓库自身
        id: detect
        run: |
          if grep -rq '{{' AGENTS.md 2>/dev/null; then
            echo "is_template=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 依赖变更审查（PR）
        # 需依赖清单文件（pyproject.toml / *.csproj / package-lock.json 等）；无清单的项目删除此步骤
        if: steps.detect.outputs.is_template != 'true' && github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
      - name: 手册数值一致性
        run: python scripts/verify-manual.py
      - name: 陷阱审计（falsy / 结构）
        run: python scripts/falsy-audit.py
      - name: 文档与结构一致性（断链/目录树/未声明文件）
        run: python scripts/verify-docs.py --strict
      - name: 注册表一致性（多注册表键集比对）
        run: python scripts/verify-registries.py
      - name: 文档计数一致性（AUTO_COUNTS 标记比对）
        run: python scripts/gen-doc-counts.py --check
      - name: 代码风格
        # Python: ruff check src/ scripts/
        # C#:    dotnet format --verify-no-changes
        if: steps.detect.outputs.is_template != 'true'
        run: "{{LINT_CMD}}"
      - name: 覆盖率门禁
        # Python: pytest --cov=src --cov-fail-under=80（需 dev 依赖 pytest-cov）
        # C#:    dotnet test --collect:"XPlat Code Coverage"（需 coverlet.collector）
        # 覆盖率数据缺失时须显式失败而非静默通过（防门禁说谎；来源：成本分析套件）。
        # set -o pipefail 防管道尾命令吞掉 pytest 失败（如 `pytest ... | tee`）。
        if: steps.detect.outputs.is_template != 'true'
        shell: bash
        run: |
          set -o pipefail
          {{COVERAGE_CMD}}

  # ============ template-self-test：模板仓库自测 ============
  # 仅模板仓库运行（检测到 AGENTS.md 中未替换的 '{{' 占位符即视为模板）。
  # 新项目初始化替换占位符后由 detect 门控直接跳过整个 job（不启动 runner，省 2 runner-minutes），无需删除。
  detect:
    name: Detect Template Mode
    uses: ./.github/workflows/detect-template.yml
  template-self-test:
    name: Template Self-Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: detect
    if: needs.detect.outputs.is_template == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 检测是否为模板仓库自身（存在未替换占位符）
        id: detect
        shell: bash
        run: |
          if grep -rq '{{' AGENTS.md 2>/dev/null; then
            echo "is_template=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 模板守卫（NewModule 模板禁止引入双花括号占位符）
        if: steps.detect.outputs.is_template == 'true'
        shell: bash
        run: |
          leaked=$(grep -rn "{{" templates/NewModule/ | grep -v ROOT_NAMESPACE || true)
          if [ -n "$leaked" ]; then
            echo "❌ 模板引入双花括号占位符（会被 init 扫描替换，应改用单花括号 {Name}）："
            echo "$leaked"
            exit 1
          fi
          echo "✅ NewModule 模板无双花括号占位符泄漏"
      - name: 模板自测（init → verify-docs/manual/falsy）
        if: steps.detect.outputs.is_template == 'true'
        run: pwsh -File scripts/test-template.ps1

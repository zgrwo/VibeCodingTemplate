# ============================================================================
# dependabot.yml — 依赖自动更新
# 使用方式：直接启用（GitHub 自动读取），按项目语言取消注释对应条目
# 注意：package-ecosystem 必须与仓库实际文件匹配，否则 GitHub 报错
#   - pip:   需要 pyproject.toml / requirements*.txt
#   - nuget: 需要 *.sln / *.csproj / packages.config
# 模板仓库根目录含 pyproject.toml（Python 清单），如需 pip 自动更新可取消注释下方
# pip 条目；现默认仅启用 github-actions（workflow 文件存在）。
# ============================================================================
version: 2
updates:
  # --- Python 项目：初始化后按需取消注释 ---
  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   open-pull-requests-limit: 5
  #   labels: ["dependencies"]

  # --- .NET 项目：初始化后按需取消注释 ---
  # - package-ecosystem: "nuget"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   open-pull-requests-limit: 5
  #   labels: ["dependencies"]

  # --- GitHub Actions 自身（模板仓库唯一实际生效条目）---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]

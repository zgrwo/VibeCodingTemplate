# ============================================================================
# ISSUE_TEMPLATE/config.yml — Issue 表单配置
# 说明：开启空白 Issue 会绕过模板；建议保持禁用，走四类模板。
# 联系链接按项目实际补充（如讨论区 / 邮件列表）。
# ============================================================================
blank_issues_enabled: false

contact_links:
  - name: 项目讨论区
    url: https://github.com/{{OWNER}}/{{REPO_NAME}}/discussions
    about: 提问、想法交流请走 Discussions（非缺陷/改进的讨论勿开 Issue）
